<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navya - Get Session ID</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            box-sizing: border-box;
            text-align: center;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #22c55e;
            border: none;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .code {
            font-size: 1.5rem;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Link Navya</h2>
        <p style="font-size: 0.85rem; color: #94a3b8;">Enter phone number with country code (e.g. 2348012345678)</p>
        <input type="text" id="phone" placeholder="2348012345678">
        <button onclick="getCode()">Get Pairing Code</button>
        <div class="code" id="result"></div>
    </div>

    <script>
        async function getCode() {
            const num = document.getElementById('phone').value;
            const resBox = document.getElementById('result');
            if (!num) return alert('Enter phone number!');

            resBox.innerText = 'Connecting...';
            try {
                const res = await fetch(`/code?number=${num}`);
                const data = await res.json();
                if (data.code) {
                    resBox.innerText = data.code;
                } else {
                    resBox.innerText = 'Error getting code.';
                }
            } catch (e) {
                resBox.innerText = 'Server error.';
            }
        }
    </script>
</body>

</html>
