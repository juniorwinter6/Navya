<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navya Bot - Pairing Code</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            color: #58a6ff;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #238636;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #2ea043;
        }

        .code-box {
            margin-top: 20px;
            padding: 15px;
            background: #0d1117;
            border: 1px dashed #58a6ff;
            border-radius: 8px;
            display: none;
        }

        .code {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #3fb950;
            margin: 10px 0;
            user-select: all;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Navya Pair Code</h2>
        <p>Enter your WhatsApp number with country code (e.g. 2348058068041) to receive an 8-digit pairing code.</p>

        <input type="text" id="phoneNumber" placeholder="2348058068041" />
        <button onclick="getCode()" id="btn">Get Pairing Code</button>

        <div class="code-box" id="codeBox">
            <span style="font-size: 12px; color: #8b949e;">YOUR PAIRING CODE:</span>
            <div class="code" id="codeDisplay">------</div>
            <p style="font-size: 12px; margin: 0;">Open WhatsApp &gt; Linked Devices &gt; Link with phone number instead
            </p>
        </div>
    </div>

    <script>
        async function getCode() {
            const num = document.getElementById('phoneNumber').value.trim();
            const btn = document.getElementById('btn');
            const codeBox = document.getElementById('codeBox');
            const codeDisplay = document.getElementById('codeDisplay');

            if (!num) return alert("Please enter your phone number");

            btn.innerText = "Generating...";
            btn.disabled = true;

            try {
                const res = await fetch(`/pair/code?number=${encodeURIComponent(num)}`);
                const data = await res.json();

                if (data.code) {
                    codeDisplay.innerText = data.code;
                    codeBox.style.display = 'block';
                    btn.innerText = "Code Generated!";
                } else {
                    alert(data.error || "Failed to fetch pairing code");
                    btn.innerText = "Get Pairing Code";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Error connecting to pairing service");
                btn.innerText = "Get Pairing Code";
                btn.disabled = false;
            }
        }
    </script>

</body>

</html>
